[package]
authors.workspace    = true
categories           = ["games"]
description          = "Desktop raylib frontend for Fatherload"
edition.workspace    = true
keywords             = ["game", "mining", "raylib"]
license.workspace    = true
name                 = "fatherload_game"
readme               = "README.md"
repository.workspace = true
version.workspace    = true

[features]
default = []
fail-on-warnings = [
    "fatherload_netcode/fail-on-warnings",
    "fatherload_quic_transport/fail-on-warnings",
    "fatherload_simulation/fail-on-warnings",
]

[[bin]]
name = "fatherload"
path = "src/main.rs"

[dependencies]
fatherload_netcode        = { workspace = true }
fatherload_quic_transport = { workspace = true }
fatherload_simulation     = { workspace = true }
getrandom                = { workspace = true }
raylib                   = { workspace = true }
serde                    = { workspace = true }
serde_json               = { workspace = true }

# MSVC's linker rejects the raylib wrapper's references to the models module even though the
# game never calls them (macOS/Linux linkers drop them), so compile that module in on Windows.
[target.'cfg(windows)'.dependencies]
raylib = { workspace = true, features = ["SUPPORT_MODULE_RMODELS"] }
