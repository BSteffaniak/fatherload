[workspace]
members  = ["packages/game", "packages/netcode", "packages/quic_transport", "packages/simulation"]
resolver = "2"

[workspace.package]
authors    = ["Braden Steffaniak"]
edition    = "2024"
license    = "MPL-2.0"
readme     = "README.md"
repository = "https://github.com/BSteffaniak/drillgame"
version    = "0.0.1-alpha.0"

[workspace.dependencies]
bytes = "1.11.1"
drillgame_netcode = { version = "0.0.1-alpha.0", path = "packages/netcode" }
drillgame_simulation = { version = "0.0.1-alpha.0", path = "packages/simulation" }
hostname = "0.4.2"
mdns-sd = "0.18.2"
postcard = { version = "1.1.3", default-features = false, features = [
    "use-std",
] }
quinn = { version = "0.11.9", default-features = false, features = [
    "rustls",
    "ring",
    "runtime-tokio",
] }
raylib = { version = "6.0.0", default-features = false, features = [
    "SUPPORT_MODULE_RSHAPES",
    "SUPPORT_MODULE_RTEXT",
    "SUPPORT_MODULE_RTEXTURES",
    "SUPPORT_MODULE_RAUDIO",
    "SUPPORT_FILEFORMAT_WAV",
    "SUPPORT_FILEFORMAT_TTF",
] }
rcgen = { version = "0.13.2", default-features = false, features = [
    "crypto",
    "ring",
] }
serde = { version = "1.0.228", default-features = false, features = [
    "derive",
    "std",
] }
serde_json = { version = "1.0.150", default-features = false, features = [
    "std",
] }
tokio = { version = "1.48.0", default-features = false, features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
] }
